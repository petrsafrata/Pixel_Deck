site_name: Pixel Deck Documentation
site_description: Documentation for Pixel Deck
site_author: Petr Šafrata
site_url: https://petrsafrata.github.io/Pixel_Deck/

repo_name: petrsafrata/Pixel_Deck
repo_url: https://github.com/petrsafrata/Pixel_Deck

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: ../assets/images/app/pixel-deck-logo-small.png
  favicon: ../assets/images/app/pixel-deck-logo-small.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md

  - Getting Started:
      - Development: getting-started/development.md
      - Raspberry Pi Deployment: getting-started/deployment.md
      - Hardware Setup: getting-started/hardware.md

  - User Guide:
      - Configuration: user-guide/configuration.md
      - Web Control Center: user-guide/web-control-center.md
      - Scenes: user-guide/scenes.md

  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - Creating a Custom Scene: developer-guide/custom-scenes.md
      - Web Configuration Schema: developer-guide/field-spec.md
      - Frontend Development: developer-guide/frontend.md

  - Operations:
      - Docker & Permissions: operations/docker.md
      - Troubleshooting: operations/troubleshooting.md

  - Legal:
      - License: license.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

copyright: Copyright &copy; 2026 Petr Šafrata